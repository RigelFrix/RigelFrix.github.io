<!doctype html>
<html>
<head>
<style>html,body{margin:0;background:#cfd8e6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.min.js","three/addons/":"/vendor/three/addons/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const params = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#cfd8e6");
scene.add(new THREE.HemisphereLight("#ffffff", "#667", 1.4));
const sun = new THREE.DirectionalLight("#ffffff", 2);
sun.position.set(-2, 4, 3);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 1000);
const model = (await new GLTFLoader().loadAsync(encodeURI(params.get("file")))).scene;
scene.add(model);
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
window.info = { size: size.toArray().map((v) => +v.toFixed(3)), center: center.toArray().map((v) => +v.toFixed(3)) };
window.view = (yaw, elev) => {
  const r = Math.max(size.x, size.y, size.z) * 2.3;
  camera.position.set(center.x + Math.sin(yaw) * Math.cos(elev) * r, center.y + Math.sin(elev) * r, center.z + Math.cos(yaw) * Math.cos(elev) * r);
  camera.lookAt(center);
  renderer.render(scene, camera);
};
window.ready = true;
</script>
</body>
</html>

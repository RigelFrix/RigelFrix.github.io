<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Outer Cyan/Blue Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="85%" stop-color="#1e3a8a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Circular Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Primary Vertical Needle Gradient -->
    <linearGradient id="vNeedle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="18%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="46%" stop-color="#ffffff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Primary Horizontal Needle Gradient -->
    <linearGradient id="hNeedle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="18%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="46%" stop-color="#ffffff" />
      <stop offset="54%" stop-color="#ffffff" />
      <stop offset="82%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Secondary Diagonal Ray Gradient -->
    <radialGradient id="diagNeedle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Core Nucleus Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Bloom Filter -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Blue Star Glow Aura -->
  <circle cx="32" cy="32" r="26" fill="url(#nebulaGlow)" opacity="0.6" />

  <!-- Circular Crown (Corona Ring) -->
  <!-- Outer soft glow of the crown -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.3" filter="url(#bloom)" />
  <!-- Main crisp crown ring -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#crownGrad)" stroke-width="1.4" opacity="0.95" />
  <!-- Inner fine celestial dashed ring -->
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-dasharray="2.5 5" opacity="0.8" />
  
  <!-- Crown Cardinal Notches / Compass Jewels -->
  <circle cx="32" cy="13.5" r="1.3" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="32" cy="50.5" r="1.3" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="13.5" cy="32" r="1.3" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="50.5" cy="32" r="1.3" fill="#ffffff" filter="url(#bloom)" />

  <!-- Crown Diagonal Pips -->
  <circle cx="20.5" cy="20.5" r="0.8" fill="#7dd3fc" opacity="0.7" />
  <circle cx="43.5" cy="20.5" r="0.8" fill="#7dd3fc" opacity="0.7" />
  <circle cx="20.5" cy="43.5" r="0.8" fill="#7dd3fc" opacity="0.7" />
  <circle cx="43.5" cy="43.5" r="0.8" fill="#7dd3fc" opacity="0.7" />

  <!-- Secondary 4-Point Diagonal Diamond Star -->
  <g transform="rotate(45 32 32)">
    <path d="M32 16 L34.5 29.5 L48 32 L34.5 34.5 L32 48 L29.5 34.5 L16 32 L29.5 29.5 Z" fill="url(#diagNeedle)" />
  </g>

  <!-- Primary Horizontal & Vertical Diffraction Needles (Full Reach) -->
  <!-- Horizontal Needle Ray -->
  <path d="M3 32 Q 22 29.8 32 29 Q 42 29.8 61 32 Q 42 34.2 32 35 Q 22 34.2 3 32 Z" fill="url(#hNeedle)" />
  <!-- Vertical Needle Ray -->
  <path d="M32 3 Q 29.8 22 29 32 Q 29.8 42 32 61 Q 34.2 42 35 32 Q 34.2 22 32 3 Z" fill="url(#vNeedle)" />

  <!-- Laser Fine Core Lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-width="0.9" opacity="0.85" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#ffffff" stroke-width="0.9" opacity="0.85" />

  <!-- Center Stylized Diamond Jewel (Facet Cut for Crisp Game Silhouette) -->
  <g filter="url(#bloom)">
    <!-- Top-Right Facet -->
    <path d="M32 19 L36 29 L45 32 L34.5 33.2 L32 32 Z" fill="#ffffff" />
    <!-- Bottom-Left Facet -->
    <path d="M32 45 L28 35 L19 32 L29.5 30.8 L32 32 Z" fill="#e0f2fe" />
    <!-- Top-Left Facet -->
    <path d="M32 19 L29 29 L19 32 L31 33.2 L32 32 Z" fill="#bae6fd" />
    <!-- Bottom-Right Facet -->
    <path d="M32 45 L35 35 L45 32 L33 30.8 L32 32 Z" fill="#7dd3fc" />
  </g>

  <!-- Central Blinding White Core (Rigel Nucleus) -->
  <circle cx="32" cy="32" r="5" fill="url(#coreGlow)" />
  <circle cx="32" cy="32" r="2.6" fill="#ffffff" />
</svg>
